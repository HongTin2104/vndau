name: Feature request
description: A new option, function or CLI behaviour
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The text you are working with and where vndau falls short today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would help
      description: The API or CLI you have in mind, with an input and the output you expect.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: What you use now, or other ways this could work.
