name: Publish

# Runs when a GitHub release is published. Uses npm trusted publishing (OIDC),
# so no NPM_TOKEN secret is needed and the package gets a provenance statement.
on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm ci
      - run: npm publish --access public
